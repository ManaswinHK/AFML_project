# v3 Phase 3 headroom gate: K walled lanes, one enabler + one finisher each (multi_event_layout).
env: "planted"

env_args:
  map_name: "multi_event_layout"
  layout_kwargs:
    n_events: 1
    delay: 0
    horizon: 25
    lane_length: 4
    n_bystanders: 0     # Phase 4: optional task-less agents in their own walled row
  present: null
  reward_mode: "team"
  dropout_p: 0.0        # Phase 4.1: probability per episode of a random persistent stop
  dropout_null: "noop"
  dropout_seed: 0

test_greedy: True
test_nepisode: 32
test_interval: 10000
log_interval: 10000
runner_log_interval: 10000
learner_log_interval: 10000
t_max: 1000000
