# v3 Phase 3 headroom gate: K walled lanes, one enabler + one finisher each (multi_event_layout).
env: "planted"

env_args:
  map_name: "multi_event_layout"
  layout_kwargs:
    n_events: 1
    delay: 0
    horizon: 25
    lane_length: 4
  present: null
  reward_mode: "team"

test_greedy: True
test_nepisode: 32
test_interval: 10000
log_interval: 10000
runner_log_interval: 10000
learner_log_interval: 10000
t_max: 1000000
